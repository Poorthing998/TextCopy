# TextCopy Configuration File

# Hotkey configuration
# Format: "ctrl+alt+c", "alt+c", "f9"
# Note: Use lowercase for keys
hotkey: "ctrl+alt+c"

# Pause/Resume hotkey
pause_hotkey: "ctrl+alt+p"

# View captures hotkey
view_hotkey: "ctrl+alt+v"

# Exit hotkey
exit_hotkey: "ctrl+alt+q"

# Output settings
output_format: "both"  # Options: "word", "txt", "both"
output_directory: "captures"
word_file: "my_captures.docx"
text_file: "captures.txt"

# Capture settings - SIMPLIFIED
include_timestamp: false   # Just use numbers (1. 2. 3.)
include_source: false      # Don't detect source
include_separator: false   # No fancy separators
auto_categorize: false     # Keep it simple

# Formatting options
word_format:
  font_name: "Calibri"
  font_size: 11
  heading_size: 12
  add_page_break: false   # Add page break between captures

# Notification settings
show_notifications: true  # Show notification on successful capture
notification_sound: false # Play sound on capture

# Advanced settings - SIMPLIFIED
auto_copy: false          # Don't auto-copy, just read clipboard (more reliable)
copy_delay: 0.3           # Wait longer to avoid double-triggers
max_capture_length: 0     # No limit
deduplicate: false        # Allow duplicates if user wants them
use_backup_on_lock: true  # Keep this for Windows

# Logging
log_level: "INFO"         # Less verbose
log_file: "textcopy.log"
